name: Bekoo CI and deploy to AWS EC2
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bekoo-aws-${{ github.ref }}
  # Let an in-flight SSH deployment finish/rollback.
  cancel-in-progress: false
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Build shared event library
        run: bash booking-server-query/mvnw -B -f booking-care-document/pom.xml clean install
      - name: Verify Command and Query, then package executable JARs
        # *ApplicationTests need live external services and are covered by the EC2 integration checklist.
        run: |
          for service in command query; do
            bash "booking-server-$service/mvnw" -B -f "booking-server-$service/pom.xml" clean verify '-Dtest=*Test'
          done
      - name: Validate runtime bundle and deploy failure scenarios
        run: |
          python3 -m unittest discover -s deploy/aws/tests -v
          for script in deploy/aws/server/*.sh; do bash -n "$script"; done
          staging=$(mktemp -d)
          cp deploy/aws/compose.yaml "$staging/compose.yaml"
          for name in command query infra release; do cp "deploy/aws/$name.env.example" "$staging/$name.env"; done
          docker compose --env-file "$staging/release.env" -f "$staging/compose.yaml" config --quiet
      - name: Upload verified JARs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bekoo-jars
          retention-days: 1
          if-no-files-found: error
          path: |
            booking-server-command/target/booking-server-command-0.0.1-SNAPSHOT.jar
            booking-server-query/target/booking-server-query-0.0.1-SNAPSHOT.jar
  release:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bekoo-jars
          path: .
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          registry="$account.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Publish Command image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: booking-server-command/aws.Dockerfile
          platforms: ${{ vars.AWS_PLATFORM || 'linux/amd64' }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/bekoo-command:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/bekoo-command:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Publish Query image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: booking-server-query/aws.Dockerfile
          platforms: ${{ vars.AWS_PLATFORM || 'linux/amd64' }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/bekoo-query:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/bekoo-query:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Prepare runtime files and deploy exact SHA over verified SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_SSH_USER || 'ec2-user' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          BEKOO_ENV: ${{ secrets.BEKOO_ENV }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$EC2_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 2
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 2
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          test -n "$EC2_SSH_KEY" && test -n "$EC2_KNOWN_HOSTS"
          staging=$(mktemp -d "$RUNNER_TEMP/bekoo.XXXXXX")
          trap 'rm -rf "$staging"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" > "$staging/key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$staging/known_hosts"
          python3 deploy/aws/prepare-release.py "$staging/release"
          cp deploy/aws/server/activate-release.sh "$staging/release/activate-release.sh"
          options=(-i "$staging/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$staging/known_hosts" -o ConnectTimeout=20)
          remote="bekoo/incoming/$GITHUB_SHA"
          ssh "${options[@]}" "$EC2_USER@$EC2_HOST" "umask 077; mkdir -p '$remote'"
          scp "${options[@]}" "$staging/release/"* "$EC2_USER@$EC2_HOST:$remote/"
          ssh "${options[@]}" "$EC2_USER@$EC2_HOST" "bash '$remote/activate-release.sh' '$GITHUB_SHA' '$ECR_REGISTRY'"
