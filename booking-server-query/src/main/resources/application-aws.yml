spring:
  kafka:
    consumer:
      group-id: bekoo-query
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
logging:
  config: classpath:logback-aws.xml
  level:
    root: INFO
    com.example: INFO
server:
  port: 8080
  address: 0.0.0.0
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 20
      min-spare: 2
