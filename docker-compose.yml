services:
  kafka:
    image: bitnamilegacy/kafka:3.3.2
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/bitnami/kafka

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-booking_care_command}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Fill MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Fill REDIS_PASSWORD in .env}"]
    volumes:
      - redis_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.name: docker-cluster
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Fill ELASTIC_PASSWORD in .env}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data

  booking-care-command:
    build:
      context: .
      dockerfile: booking-server-command/Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - kafka
    ports:
      - "8083:${COMMAND_SERVER_PORT:-8080}"
    environment:
      SERVER_PORT: ${COMMAND_SERVER_PORT:-8080}
      SPRING_URL: ${COMMAND_PUBLIC_URL:-http://localhost:8083}
      DB_URL: ${DB_URL:?Fill DB_URL in .env}
      DB_USER: ${DB_USER:?Fill DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Fill DB_PASSWORD in .env}
      KAFKA_PORT: ${KAFKA_PORT:-kafka:9092}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Fill REDIS_PASSWORD in .env}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:?Fill JWT_SECRET in .env}
      WEB_URL: ${WEB_URL:-http://localhost:8082/home}
      AI_URL: ${AI_URL:-http://bekoo-ai:5501/ask}
      API_KEY: ${API_KEY:-}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:8083/payment/result}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_SECRET_KEY: ${VNPAY_SECRET_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Quản trị hệ thống}
      ADMIN_CCCD: ${ADMIN_CCCD:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_PROVINCE: ${ADMIN_PROVINCE:-}
      ADMIN_DISTRICT: ${ADMIN_DISTRICT:-}
      ADMIN_COMMUNE: ${ADMIN_COMMUNE:-}
      ADMIN_DOB: ${ADMIN_DOB:-}
      ADMIN_GENDER: ${ADMIN_GENDER:-}

  booking-care-query:
    build:
      context: .
      dockerfile: booking-server-query/Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      - kafka
      - redis
      - elasticsearch
    ports:
      - "8084:${QUERY_SERVER_PORT:-8081}"
    environment:
      SERVER_PORT: ${QUERY_SERVER_PORT:-8081}
      SERVER_ADDRESS: ${SERVER_ADDRESS:-0.0.0.0}
      SPRING_URL: ${QUERY_PUBLIC_URL:-http://localhost:8084}
      ELASTIC_USERNAME: ${ELASTIC_USERNAME:-elastic}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Fill ELASTIC_PASSWORD in .env}
      ELASTIC_URIS: ${ELASTIC_URIS:-http://elasticsearch:9200}
      KAFKA_SERVER: ${KAFKA_SERVER:-kafka:9092}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Fill REDIS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Fill JWT_SECRET in .env}

  bekoo-ai:
    image: datj114/bekoo-ai:v2.0.0
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  es_data:
