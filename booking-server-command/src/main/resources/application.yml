spring:
  application:
    name: BookingCare
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update
  mail:
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  kafka:
    bootstrap-servers: ${KAFKA_PORT}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  web:
    resources:
      add-mappings: false
      #Khong tu anh xa tai nguyen tinh

logging:
  level:
    root: error
server:
  port: ${SERVER_PORT:8080}

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD}
cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:}
  api_key: ${CLOUDINARY_API_KEY:}
  api_secret: ${CLOUDINARY_API_SECRET:}
mail:
  user: ${MAIL_USER:}
spring.url: ${SPRING_URL:http://localhost:8083}
web.url: ${WEB_URL:http://localhost:8082/home}
ai.url: ${AI_URL:http://bekoo-ai:5501/ask}
api.key: ${API_KEY:}
vnpay.return.url: ${VNPAY_RETURN_URL:http://localhost:8083/payment/result}
